services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: devadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8081
    volumes:
      - ./infra/keycloak/orderflow-realm.json:/opt/keycloak/data/import/orderflow-realm.json:ro

volumes:
  postgres_data:
