name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Maven verification
        run: ./mvnw -B -ntp verify

  container-smoke:
    name: Container / OIDC smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Provide development-only environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose --profile app --profile auth config --quiet
      - name: Build and start the complete stack
        run: docker compose --profile app --profile auth up -d --build --wait
      - name: Smoke test real signed JWT and business flow
        run: bash infra/scripts/smoke-container.sh
      - name: Bounded k6 catalog and single-unit contention probes
        run: bash perf/scripts/run-ci-load.sh
      - name: PostgreSQL custom-format backup and isolated restore drill
        env:
          RESTORE_DRILL_LOCAL_ONLY: "YES"
        run: bash perf/scripts/restore-drill.sh
      - name: Upload anonymized performance and restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage8-local-ci-evidence
          path: perf-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show service logs after failure
        if: failure()
        run: docker compose --profile app --profile auth logs --tail=150
      - name: Remove containers and disposable test data
        if: always()
        run: docker compose --profile app --profile auth down -v --remove-orphans

  workflow-lint:
    name: Lint GitHub Actions YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate all workflow triggers and expressions
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
