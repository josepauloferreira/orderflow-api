name: Format Java (temporary maintenance)
on:
  pull_request:
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/engineering-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply Google Java Format
        run: ./mvnw -B -ntp spotless:apply
      - name: Commit formatting-only changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'src/**/*.java'
            git diff --cached --quiet || git commit -m "style: apply Spotless to final engineering review"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
